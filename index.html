// Função auxiliar para mapear estatísticas dos eventos originais para os atributos do jogo (m, p, s, d, h)
// p = Carreira/Reputação/Inteligência, d = Felicidade/Diversão, m = Dinheiro, h = Saúde, s = Social
function mapStat(stat, val) {
  const norm = stat.toLowerCase().trim();
  if (norm.includes("carreira") || norm.includes("reputação") || norm.includes("inteligência")) return { p: val };
  if (norm.includes("felicidade") || norm.includes("diversão")) return { d: val };
  if (norm.includes("dinheiro")) return { m: val * 10 };
  if (norm.includes("saúde")) return { h: val };
  return { d: val };
}

function parseEffects(effStr) {
  const clean = effStr.replace(/[\(\)]/g, "");
  const parts = clean.split("|");
  const res = {};
  parts.forEach(p => {
    const m = p.trim().match(/([A-Za-zãéíóúÁÉÍÓÚç]+)\s*([\+\-]\d+)%/);
    if (m) {
      const obj = mapStat(m[1], parseInt(m[2], 10));
      Object.assign(res, obj);
    }
  });
  return res;
}

function gerarSugestoesDia(charIdx) {
  const favCats = P[charIdx].favActCat;
  const pool = [];
  ACT_CATS.forEach((cat, cIdx) => {
    cat.items.forEach((it, iIdx) => {
      const weight = favCats.includes(cIdx) ? 3 : 1;
      for (let w = 0; w < weight; w++) pool.push({ cIdx, iIdx, isFav: favCats.includes(cIdx) });
    });
  });
  const chosen = [];
  const used = new Set();
  while (chosen.length < 3 && pool.length) {
    const pick = R(pool);
    const key = `${pick.cIdx}-${pick.iIdx}`;
    if (!used.has(key)) {
      used.add(key);
      chosen.push(pick);
    }
  }
  return chosen;
}

let audioCtx = null, musOn = false, musTimer = null, musStep = 0;

function sfx(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);

    if (type === 'tap') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.05);
      g.gain.setValueAtTime(0.05, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'age') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(392, now);
      osc.frequency.setValueAtTime(523.25, now + 0.07);
      osc.frequency.setValueAtTime(659.25, now + 0.14);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.start(now); osc.stop(now + 0.28);
    } else if (type === 'cash') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987.77, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.07);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'promo') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'triangle'; o2.frequency.value = freq;
        g2.gain.setValueAtTime(0.07, now + idx * 0.09);
        g2.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.22);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(now + idx * 0.09); o2.stop(now + idx * 0.09 + 0.22);
      });
    } else if (type === 'bad') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(185, now);
      osc.frequency.linearRampToValueAtTime(125, now + 0.22);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.start(now); osc.stop(now + 0.24);
    }
  } catch (e) {}
}

function toggleMusic() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musOn = !musOn;
    if (musOn) {
      audioCtx.resume();
      const notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
      musTimer = setInterval(() => {
        if (!musOn) return;
        const now = audioCtx.currentTime;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = notes[musStep % notes.length];
        g.gain.setValueAtTime(0.022, now);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.35);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(now + 0.36); o.stop(now + 0.36);
        musStep++;
      }, 420);
    } else clearInterval(musTimer);
  } catch (e) { musOn = false; }
  render();
}

  el.style.top = (window.innerHeight * 0.44) + "px";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

    if (c.m < 15) { sfx('bad'); floatBadge("Sem grana! 💸", "#e55353"); return; }
    const g = S.cook.filter(x => x !== i);
    c.m -= 15; c.f = cl(c.f + 30);
    sfx('cash'); floatBadge("-R$ 15 | +30% Fome", "#2eb85c");
    if (g.length) {
      c.s = cl(c.s + 12);
      g.forEach(x => {
        S.ch[x].s = cl(S.ch[x].s + 12);
        addLog(x, `${p.n} entrou na cozinha e fizemos um almoço coletivo (+12% Social).`, "🍳 República");
      });
      addLog(i, "Cozinhei em grupo com a galera da república! (+30% Fome, +12% Social para todos).", "🍳 Cozinha");
    } else {
      addLog(i, "Preparei comida caseira na cozinha da república (+30% Fome).", "🍳 Cozinha");
    }
    if (!S.cook.includes(i)) S.cook.push(i);
  }
  else if (k === "dor") {
    const gain = Math.round(80 + getBonus(c, i, "sl"));
    c.e = cl(c.e + gain);
    sfx('tap'); floatBadge(`+${gain}% Energia`, "#2b7de9");
    addLog(i, `Tirei um sono reparador e recuperei +${gain}% de Energia.`, "💤 Descanso");
  }
  else if (k === "trab") {
    if (c.e < 40) { sfx('bad'); floatBadge("Energia < 40%! 💤", "#e55353"); return; }
    const ant = lvl(c);
    const pg = Math.round(p.pay * (1 + ant * 0.6) * (1 + getBonus(c, i, "wk")));
    const g = Math.round(7 * (1 + getBonus(c, i, "tp")));
    c.m += pg; c.e -= 40; c.f = cl(c.f - 20); c.p = cl(c.p + g);
    sfx('cash'); floatBadge(`+R$ ${pg} | +${g}% Carreira`, "#2eb85c");
    let txt = `Cumpri expediente (${p.w}): ganhei R$ ${pg} e +${g}% de progresso na carreira (-40% Energia, -20% Fome).`;
    if (lvl(c) > ant) {
      txt += ` 🎉 PROMOÇÃO: Agora sou ${p.car[lvl(c)]}!`;
      sfx('promo');
    } else if (c.p >= 100) {
      txt += ` 🏆 Alcancei o topo da profissão!`;
    }
    addLog(i, txt, `💼 ${p.w}`);
  }
  else if (k === "int") {
    const o = R(S.ch.map((x, j) => j).filter(j => j !== i && S.ch[j].vivo));
    c.s = cl(c.s + 30); c.d = cl(c.d + 8);
    sfx('tap'); floatBadge("+30% Social", "#2b7de9");
    if (o === undefined) {
      addLog(i, "Conversei sozinho com as paredes da sala (+30% Social).", "🎲 Social");
    } else {
      const fala = R(FALAS).replace(/{a}/g, p.n).replace(/{b}/g, P[o].n);
      addLog(i, `${fala} (+30% Social, +8% Diversão).`, "🎲 República");
    }
  }
  else if (k === "sair") {
    if (c.m < 50) { sfx('bad'); floatBadge("Sem grana! 💸", "#e55353"); return; }
    ap(c, { m: -50, d: 35, s: 22, e: -15 });
    sfx('cash'); floatBadge("-R$ 50 | +35% Diversão", "#8338ec");
    addLog(i, `${R(["Fui para uma festa universitária e voltei rouco.", "Saí para o rolê com a galera da faculdade."])} (-R$ 50, +35% Diversão, +22% Social).`, "🎉 Rolê");
  }

  c.sl--;
  sheet = null;
  render(true);
}

function actGeneral(catIdx, itemIdx) {
  const i = S.at, c = S.ch[i], p = P[i];
  if (!c.vivo || c.sl < 1) return;
  const cat = ACT_CATS[catIdx];
  const it = cat.items[itemIdx];
  const fx = { ...it[3] };
  if (fx.m < 0 && c.m < -fx.m) { sfx('bad'); floatBadge("Saldo insuficiente! 💸", "#e55353"); return; }
  if (fx.e < 0 && c.e < -fx.e) { sfx('bad'); floatBadge("Energia insuficiente! 💤", "#e55353"); return; }

  const isFav = p.favActCat.includes(catIdx);
  if (isFav && fx.d > 0) fx.d += 6;

  ap(c, fx);
  sfx('tap');
  floatBadge(`${it[1]} ${isFav ? '⭐ Afinidade!' : it[0]}`, isFav ? "#8338ec" : "#2b7de9");

  let txt = `${it[4]}${isFav ? " ⭐ (Afinidade pessoal: +6% Diversão extra!)" : ""} (${fxSummary(fx)}).`;
  if (it[5] && Math.random() < it[5][0]) {
    ap(c, it[5][1]);
    txt += ` 😬 Ops: ${it[5][2]} (${fxSummary(it[5][1])}).`;
    sfx('bad');
  }

  addLog(i, txt, `${cat.e} ${it[0]}`);
  c.sl--;
  sheet = null;
  render(true);
}

function buyExclusive(j) {
  const i = S.at, c = S.ch[i], it = P[i].loja[j];
  if (!c.vivo || c.m < it[2] || c.inv.includes(j)) return;
  c.m -= it[2];
  c.inv.push(j);
  sfx('promo');
  floatBadge(`Comprou ${it[0]}!`, "#2eb85c");
  addLog(i, `Adquiri item exclusivo: ${it[1]} ${it[0]} por R$ ${it[2]} (${it[4]}).`, "⭐ Item Exclusivo");

}

function buyShopItem(catId, itemIdx) {
  const i = S.at, c = S.ch[i];
  const code = `${catId}-${itemIdx}`;
  const it = SHOP_CATS[catId].items[itemIdx];
  if (!c.vivo || c.m < it[2] || c.bens.includes(code)) return;
  c.m -= it[2];
  c.bens.push(code);
  sfx('promo');
  floatBadge(`${it[1]} Adquirido!`, "#2eb85c");
  addLog(i, `Comprei ${it[1]} ${it[0]} por R$ ${it[2]} (${it[4]}).`, "🛍️ Bens");
  render(true);
}

function adoptPet(catId, petIdx) {
  const i = S.at, c = S.ch[i], p = P[i];
  const pet = PET_CATS[catId].pets[petIdx];
  if (!c.vivo || c.m < pet[2]) { sfx('bad'); floatBadge("Saldo insuficiente! 💸", "#e55353"); return; }
  if (c.pets.length >= 3) { sfx('bad'); floatBadge("Máximo de 3 pets no quarto!", "#f5a623"); return; }

  c.m -= pet[2];
  const isFavPet = p.favPetCat === catId;
  c.pets.push({ catId, petIdx, fel: 100, fed: true });
  c.s = cl(c.s + 15);
  c.d = cl(c.d + (isFavPet ? 20 : 12));

  sfx('promo');
  floatBadge(`${pet[1]} Adotado!`, "#ec4899");
  addLog(i, `Adotei um(a) ${pet[1]} ${pet[0]} por R$ ${pet[2]}! ${isFavPet ? "💖 (Pet dos sonhos! +20% Diversão)" : "(+15% Social, +12% Diversão)"}`, "🐾 Novo Pet");
  render(true);
}

function carePet(pIdx, action) {
  const i = S.at, c = S.ch[i];
  const myPet = c.pets[pIdx];
  if (!c.vivo || !myPet) return;
  const info = PET_CATS[myPet.catId].pets[myPet.petIdx];

  if (action === "feed") {
    if (myPet.fed) { floatBadge("Já está alimentado hoje!", "#64748b"); return; }
    if (c.m < 10) { sfx('bad'); floatBadge("Precisa de R$ 10 para ração!", "#e55353"); return; }
    c.m -= 10;
    myPet.fed = true;
    myPet.fel = cl(myPet.fel + 20);
    sfx('cash');
    floatBadge(`Alimentou ${info[0]} (-R$ 10)`, "#2eb85c");
    addLog(i, `Alimentei meu(minha) ${info[1]} ${info[0]} (-R$ 10, Felicidade do pet: ${myPet.fel}%).`, "🐾 Cuidado Pet");
  } else if (action === "play") {
    if (myPet.played) { floatBadge("Já brincou hoje!", "#64748b"); return; }
    myPet.played = true;
    myPet.fel = cl(myPet.fel + 25);
    c.d = cl(c.d + 12);
    c.s = cl(c.s + 8);
    sfx('tap');
    floatBadge(`Brincou com ${info[0]} (+12% Div)`, "#ec4899");
    addLog(i, `Brinquei com meu(minha) ${info[1]} ${info[0]} (+12% Diversão, +8% Social).`, "🐾 Brincadeira");
  }
  render(true);
}

// 9. PASSAR O DIA (+1 DIA BITLIFE)
// =========================================================================
function passa() {
  const pendingIdx = S.ch.findIndex(x => x.vivo && x.sl > 1);
  if (pendingIdx !== -1) {
    S.at = pendingIdx;
    sheet = null;
    sfx('bad');
    floatBadge(`${P[pendingIdx].n} precisa agir!`, "#f5a623");
    render(true);
    return;
  }

  sfx('age');
  const rep = [];

  S.ch.forEach((c, i) => {
    if (!c.vivo) return;
    const l = [];
    let faint = 0;

    const dropF = Math.max(8, 25 - getBonus(c, i, "df"));
    const dropE = 20;
    const dropS = Math.max(4, 15 - getBonus(c, i, "ds"));
    const dropD = Math.max(4, 15 - getBonus(c, i, "dd"));
    const healH = getBonus(c, i, "dh");

    c.f -= dropF;
    c.e -= dropE;
    c.s = cl(c.s - dropS);
    c.d = cl(c.d - dropD);
    if (healH > 0) c.h = cl(c.h + healH);

    c.pets.forEach(pt => {
      const info = PET_CATS[pt.catId].pets[pt.petIdx];
      if (pt.fed) {
        ap(c, info[4]);
        l.push(`${info[1]} ${info[0]} trouxe alegria (${fxSummary(info[4])}).`);
      } else {
        pt.fel = cl(pt.fel - 30);
        l.push(`⚠️ ${info[1]} ${info[0]} ficou com fome (-30% felicidade do pet).`);
      }
      pt.fed = false;
      pt.played = false;
    });

    if (c.f <= 0) {
      c.f = 0; c.vivo = 0; c.causa = "Morreu de inanição 🍔";
      rep.push([i, "☠️ Não resistiu à fome extrema."]);
      return;
    }
    if (c.e <= 0) {
      c.e = 30; faint = 1;
      l.push("😵 Desmaiou de exaustão e perdeu os períodos do dia seguinte.");
    }
    c.e = cl(c.e); c.f = cl(c.f);
    if (c.s <= 0) { c.h = cl(c.h - 15); l.push("😔 Isolamento severo (-15% Saúde)."); }
    if (c.d <= 0) { c.h = cl(c.h - 15); l.push("🥱 Tédio esmagador (-15% Saúde)."); }
    if (c.h <= 0) {
      c.vivo = 0; c.causa = "Colapso nervoso 🧠";
      rep.push([i, "☠️ Sofreu um colapso nervoso."]);
      return;
    }

    c.sl = faint ? 0 : 3;
    c.sug = gerarSugestoesDia(i);
    const summaryText = l.length ? l.join(" ") : "Sobreviveu mais um dia na república.";
    rep.push([i, summaryText]);
  });

  S.dia++;
  S.cook = [];

  if (S.dia <= DIAS) {
    S.ch.forEach((c, i) => {
      if (c.vivo) {
        const prevRep = rep.find(r => r[0] === i);
        addLog(i, prevRep ? prevRep[1] : "Novo dia amanheceu na república.", "☀️ Amanhecer");
      }
    });
  }

  if (S.dia > DIAS || !S.ch.some(c => c.vivo)) {
    S.ov = { t: "rep", rep, fim: 1 };
  } else {
    S.ov = { t: "rep", rep, ev: (S.dia - 1) % 2 === 0 };
  }
  sheet = null;
  render(true);
}

function aposRel() {
  sfx('tap');
  const o = S.ov;
  if (o.fim) { S.ov = { t: "fim" }; return render(); }
  if (o.ev) {
    if (!S.ch[S.at].vivo) S.at = S.ch.findIndex(c => c.vivo);
    const e = R(EG);
    S.ov = { t: "ev", e };
    return render();
  }
  S.ov = null;
  render(true);
}

function escolhe(k) {
  const e = S.ov.e, i = S.at, c = S.ch[i], o = e[k + 1];
  ap(c, o[1]);
  sfx('promo');
  floatBadge(fxSummary(o[1]), "#2b7de9");
  addLog(i, `${o[2]} (${fxSummary(o[1])})`, "🎲 Decisão");
  S.ov = null;
  render(true);
}

  return `
    <div class="flex items-center gap-2 text-[11px]">
      <span class="w-4 text-center">${icon}</span>
      <span class="w-16 truncate ${warn}">${label}</span>
      <div class="flex-1 h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
        <div class="h-full ${barColor} transition-all duration-300 rounded-full" style="width:${val}%"></div>
      </div>
      <span class="w-8 text-right font-black text-[10px] ${val <= 25 ? 'text-[#e55353]' : 'text-slate-500 dark:text-slate-400'}">${val}%</span>

}

          <span class="text-xl">🐾</span>
          <span class="text-[10px] font-extrabold mt-0.5">República</span>
          ${c.pets.some(pt => !pt.fed) ? '<span class="absolute top-1 right-3 w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
        </button>

        <button onclick="openSheet('bens', 0)" class="flex flex-col items-center justify-center py-1 rounded-xl hover:bg-white/10 transition">
          <span class="text-xl">🛍️</span>
          <span class="text-[10px] font-extrabold mt-0.5">Bens/Loja</span>
        </button>
      </div>
      ${pend.length ? `
        <div class="text-center text-[10px] text-amber-300 font-extrabold mt-0.5 truncate">
          Aguardando ações: ${pend.map(x => `${x.e} ${x.n.split(' ')[0]}`).join(' · ')}
        </div>
      ` : `
        <div class="text-center text-[10px] text-emerald-300 font-extrabold mt-0.5">
          Todos prontos! Toque em +1 Dia para avançar
        </div>
      `}
    </section>

    <!-- BARRAS DE STATUS CLÁSSICAS BITLIFE -->
    <footer class="bg-[var(--bl-card)] px-4 py-2.5 border-t border-[var(--bl-border)] space-y-1.5 shrink-0">
      ${statusBar("🍔", "Fome", c.f)}
      ${statusBar("💤", "Energia", c.e)}
      ${statusBar("🤼", "Social", c.s)}
      ${statusBar("🎮", "Diversão", c.d)}
      ${statusBar("❤️", "Saúde", c.h)}
    </footer>

    ${renderSheet()}
    ${renderOverlay()}
  `;

  if (scrollFeed) {
    const feed = $("life-feed");
    if (feed) feed.scrollTop = feed.scrollHeight;
  }
}

function openSheet(name, defaultSub = 0) {
  sfx('tap');
  if (sheet === name) {
    sheet = null;
  } else {
    sheet = name;
    subTab = defaultSub;
  }
  render();
}

function setSubTab(idx) {
  sfx('tap');
  subTab = idx;
  render();
}

// =========================================================================
// 11. MENUS INFERIORES ESTILO BITLIFE (BOTTOM SHEETS COMPLETOS)
// =========================================================================
function renderSheet() {
  if (!sheet) return "";
  const i = S.at, c = S.ch[i], p = P[i];
  const off = !c.vivo || c.sl < 1;

  const itemBtn = (icon, title, sub, onClick, disabled = false, badge = "", badgeColor = "blue") => {
    const badgeStyles = {
      blue: "bg-blue-100 dark:bg-blue-900/50 text-[#2b7de9]",
      green: "bg-emerald-100 dark:bg-emerald-900/50 text-[#2eb85c]",
      purple: "bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-300",
      amber: "bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300"
    };
    return `
      <button onclick="${onClick}" ${disabled ? 'disabled' : ''}
        class="w-full flex items-center justify-between p-3.5 bg-[var(--bl-card)] hover:bg-slate-50 dark:hover:bg-slate-800/80 border-b border-[var(--bl-border)] text-left transition ${disabled ? 'opacity-45 cursor-not-allowed' : ''}">
        <div class="flex items-center gap-3 min-w-0">
          <span class="text-2xl shrink-0">${icon}</span>
          <div class="min-w-0">
            <div class="font-black text-sm flex items-center gap-1.5 flex-wrap">
              <span class="truncate">${title}</span>
              ${badge ? `<span class="text-[10px] px-1.5 py-0.5 rounded font-black ${badgeStyles[badgeColor] || badgeStyles.blue}">${badge}</span>` : ''}
            </div>
            <div class="text-xs text-[var(--bl-muted)] font-semibold leading-snug mt-0.5">${sub}</div>
          </div>
        </div>
        <span class="text-slate-400 font-black text-lg pl-2 shrink-0">›</span>
      </button>
    `;
  };

  let title = "", content = "";

  // ---------------- MENU 1: CARREIRA (EXPEDIENTE + 10 EVENTOS ESPECÍFICOS) ----------------
  if (sheet === "carreira") {
    title = `💼 Carreira · ${p.n} (${c.vivo ? c.sl : 0}/3 ações)`;
    const payCalc = Math.round(p.pay * (1 + lvl(c) * 0.6) * (1 + getBonus(c, i, "wk")));
    const evList = ALL_CAREER_EVENTS[i] || [];

    content = `
      <div class="p-3 bg-slate-100 dark:bg-slate-800/70 border-b border-[var(--bl-border)]">
        <div class="flex justify-between text-xs font-black mb-1">
          <span>Cargo Atual: ${p.car[lvl(c)]}</span>
          <span class="text-[#2b7de9]">${c.p}%</span>
        </div>
        <div class="h-2.5 bg-slate-300 dark:bg-slate-700 rounded-full overflow-hidden">
          <div class="h-full bg-[#2b7de9] rounded-full" style="width:${c.p}%"></div>
        </div>
      </div>
      ${itemBtn(
        "💼",
        p.w === "Treino" ? "Treinar na Área" : `Trabalhar (${p.w})`,
        `Salário R$ ${payCalc} · -40% Energia · -20% Fome`,
        "actBasic('trab')",
        off || c.e < 40,
        "Expediente",
        "green"
      )}
      <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)]">
        ⚡ 10 Desafios & Decisões Reais de ${p.n}
      </div>
      ${evList.map((ev, idx) => itemBtn(
        p.e,
        ev.title,
        ev.desc,
        `actCareer(${idx})`,
        off,
        `Decisão #${idx+1}`,
        "amber"
      )).join("")}
    `;
  }

  // ---------------- MENU 2: ATIVIDADES ----------------
  else if (sheet === "atividades") {
    title = `🎭 Atividades & Rotina (${c.vivo ? c.sl : 0}/3 ações)`;
    const catTabs = `
      <div class="flex gap-1.5 p-2.5 bg-slate-100 dark:bg-slate-900/70 overflow-x-auto border-b border-[var(--bl-border)] shrink-0">
        <button onclick="setSubTab(0)" class="px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${subTab === 0 ? 'bg-[#2b7de9] text-white' : 'bg-[var(--bl-card)] text-[var(--bl-muted)]'}">
          ⭐ Hoje & Básicas
        </button>
        ${ACT_CATS.map((cat, idx) => {
          const isFav = p.favActCat.includes(idx);
          return `
            <button onclick="setSubTab(${idx + 1})" class="px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${subTab === idx + 1 ? 'bg-[#2b7de9] text-white' : 'bg-[var(--bl-card)] text-[var(--bl-muted)]'}">
              ${cat.e} ${cat.name.split(' ')[0]} ${isFav ? '💖' : ''}
            </button>
          `;
        }).join("")}
      </div>
    `;

    if (subTab === 0) {
      content = catTabs + `
        <div class="px-3.5 py-2 bg-purple-50 dark:bg-purple-950/40 text-[11px] font-black uppercase tracking-wider text-purple-700 dark:text-purple-300 border-b border-[var(--bl-border)]">
          ✨ Sugestões do Dia para ${p.n} (${p.trait})
        </div>
        ${c.sug.map(sg => {
          const cat = ACT_CATS[sg.cIdx];
          const it = cat.items[sg.iIdx];
          return itemBtn(
            it[1],
            it[0],
            `${it[2]} (${fxSummary(it[3])})`,
            `actGeneral(${sg.cIdx}, ${sg.iIdx})`,
            off,
            sg.isFav ? "💖 Afinidade +6% Div" : cat.name,
            sg.isFav ? "purple" : "blue"
          );
        }).join("")}
        <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)]">
          🏠 Rotina Essencial da República
        </div>
        ${itemBtn("🍔", "Comer Podrão", "-R$ 30 · +40% Fome · -10% Saúde", "actBasic('pod')", off || c.m < 30)}
        ${itemBtn("🍳", "Cozinhar na República", "-R$ 15 · +30% Fome · +12% Social em grupo", "actBasic('coz')", off || c.m < 15, S.cook.length ? `${S.cook.length} na cozinha` : "", "green")}
        ${itemBtn("💤", "Dormir / Soneca", `+${Math.round(80 + getBonus(c, i, "sl"))}% Energia · Descanso`, "actBasic('dor')", off)}
        ${itemBtn("🎉", "Sair para Rolê / Festa", "-R$ 50 · +35% Diversão · +22% Social · -15% Energia", "actBasic('sair')", off || c.m < 50)}
      `;
    } else {
      const catIdx = subTab - 1;
      const cat = ACT_CATS[catIdx];
      const isFav = p.favActCat.includes(catIdx);
      content = catTabs + `
        <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)] flex justify-between">
          <span>${cat.e} ${cat.name} (10 atividades)</span>
          ${isFav ? '<span class="text-purple-600 dark:text-purple-300">💖 Categoria Favorita!</span>' : ''}
        </div>
        ${cat.items.map((it, itemIdx) => itemBtn(
          it[1],
          it[0],
          `${it[2]} (${fxSummary(it[3])})`,
          `actGeneral(${catIdx}, ${itemIdx})`,
          off,
          isFav ? "💖 +6% Div" : "",
          "purple"
        )).join("")}
      `;
    }
  }

  // ---------------- MENU 3: REPÚBLICA & PETS ----------------
  else if (sheet === "relacoes") {
    title = `🐾 República & Pet Shop (30 Pets)`;
    const petCatTabs = `
      <div class="flex gap-1.5 p-2.5 bg-slate-100 dark:bg-slate-900/70 overflow-x-auto border-b border-[var(--bl-border)] shrink-0">
        <button onclick="setSubTab(0)" class="px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${subTab === 0 ? 'bg-[#2b7de9] text-white' : 'bg-[var(--bl-card)] text-[var(--bl-muted)]'}">
          🏠 Convivência & Meus Pets (${c.pets.length}/3)
        </button>
        ${PET_CATS.map((pc, idx) => `
          <button onclick="setSubTab(${idx + 1})" class="px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${subTab === idx + 1 ? 'bg-[#2b7de9] text-white' : 'bg-[var(--bl-card)] text-[var(--bl-muted)]'}">
            ${pc.e} ${pc.name.split(' ')[0]} ${p.favPetCat === idx ? '💖' : ''}
          </button>
        `).join("")}
      </div>
    `;

    if (subTab === 0) {
      content = petCatTabs + `
        ${itemBtn("🎲", "Interagir com Colegas da República", "+30% Social · +8% Diversão · Diálogos e resenha", "actBasic('int')", off, "Convivência", "green")}
        <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)]">
          🐾 Meus Pets no Quarto (${c.pets.length}/3)
        </div>
        ${c.pets.length ? c.pets.map((pt, pIdx) => {
          const info = PET_CATS[pt.catId].pets[pt.petIdx];
          return `
            <div class="p-3.5 border-b border-[var(--bl-border)] bg-[var(--bl-card)]">
              <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2.5">
                  <span class="text-2xl">${info[1]}</span>
                  <div>
                    <div class="font-black text-sm">${info[0]}</div>
                    <div class="text-[11px] text-[var(--bl-muted)] font-bold">Bônus diário: ${fxSummary(info[4])} · Felicidade: ${pt.fel}%</div>
                  </div>
                </div>
                <span class="text-[10px] font-black px-2 py-0.5 rounded-full ${pt.fed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                  ${pt.fed ? 'Alimentado ✔' : 'Com Fome!'}
                </span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="carePet(${pIdx}, 'feed')" ${pt.fed || !c.vivo ? 'disabled' : ''}
                  class="py-2 px-3 rounded-xl font-black text-xs bg-[#2eb85c] text-white disabled:opacity-40">
                  🥣 Alimentar (R$ 10)
                </button>
                <button onclick="carePet(${pIdx}, 'play')" ${pt.played || !c.vivo ? 'disabled' : ''}
                  class="py-2 px-3 rounded-xl font-black text-xs bg-[#2b7de9] text-white disabled:opacity-40">
                  🎾 Brincar (+12% Div)
                </button>
              </div>
            </div>
          `;
        }).join("") : `
          <div class="p-5 text-center text-xs text-[var(--bl-muted)] font-bold">
            Você ainda não adotou nenhum pet. Navegue pelas categorias acima para adotar entre 30 espécies!
          </div>
        `}
      `;
    } else {
      const catIdx = subTab - 1;
      const pc = PET_CATS[catIdx];
      const isFav = p.favPetCat === catIdx;
      content = petCatTabs + `
        <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)] flex justify-between">
          <span>${pc.e} ${pc.name} (${pc.pets.length} espécies)</span>
          <span>Saldo: R$ ${c.m}</span>
        </div>
        ${pc.pets.map((pet, pIdx) => itemBtn(
          pet[1],
          pet[0],
          `${pet[3]} · Bônus/dia: ${fxSummary(pet[4])}`,
          `adoptPet(${catIdx}, ${pIdx})`,
          !c.vivo || c.m < pet[2] || c.pets.length >= 3,
          `Adotar R$ ${pet[2]}`,
          isFav ? "purple" : "green"
        )).join("")}
      `;
    }
  }

  // ---------------- MENU 4: BENS & LOJA ----------------
  else if (sheet === "bens") {
    title = `🛍️ Bens & Loja · Saldo: R$ ${c.m}`;
    const shopTabs = `
      <div class="flex gap-1.5 p-2.5 bg-slate-100 dark:bg-slate-900/70 overflow-x-auto border-b border-[var(--bl-border)] shrink-0">
        <button onclick="setSubTab(0)" class="px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${subTab === 0 ? 'bg-[#2b7de9] text-white' : 'bg-[var(--bl-card)] text-[var(--bl-muted)]'}">
          ⭐ Exclusivos & Posses (${c.inv.length + c.bens.length})
        </button>
        ${SHOP_CATS.map((sc, idx) => `
          <button onclick="setSubTab(${idx + 1})" class="px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${subTab === idx + 1 ? 'bg-[#2b7de9] text-white' : 'bg-[var(--bl-card)] text-[var(--bl-muted)]'}">
            ${sc.e} ${sc.name.split(' ')[0]}
          </button>
        `).join("")}
      </div>
    `;

    if (subTab === 0) {
      content = shopTabs + `
        <div class="px-3.5 py-2 bg-amber-50 dark:bg-amber-950/40 text-[11px] font-black uppercase tracking-wider text-amber-700 dark:text-amber-300 border-b border-[var(--bl-border)]">
          ⭐ Itens Exclusivos de ${p.n}
        </div>
        ${p.loja.map((it, j) => {
          const ja = c.inv.includes(j);
          return itemBtn(
            it[1],
            it[0],
            it[4],
            `buyExclusive(${j})`,
            !c.vivo || ja || c.m < it[2],
            ja ? "Adquirido ✔" : `R$ ${it[2]}`,
            ja ? "green" : "amber"
          );
        }).join("")}
        <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)]">
          🎒 Minhas Posses no Quarto (${c.inv.length + c.bens.length} itens ativos)
        </div>
        <div class="p-3.5 flex flex-wrap gap-1.5">
          ${c.inv.map(j => `<span class="px-2.5 py-1 rounded-lg bg-amber-100/80 dark:bg-amber-900/40 text-xs font-black">${p.loja[j][1]} ${p.loja[j][0]}</span>`).join("")}
          ${c.bens.map(code => {
            const [cid, iid] = code.split("-").map(Number);
            const it = SHOP_CATS[cid].items[iid];
            return `<span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 border border-[var(--bl-border)] text-xs font-extrabold">${it[1]} ${it[0]}</span>`;
          }).join("")}
          ${c.inv.length + c.bens.length === 0 ? `<span class="text-xs text-[var(--bl-muted)] italic">Nenhuma posse adquirida ainda. Explore as 6 categorias acima!</span>` : ""}
        </div>
      `;
    } else {
      const catIdx = subTab - 1;
      const sc = SHOP_CATS[catIdx];
      content = shopTabs + `
        <div class="px-3.5 py-2 bg-slate-50 dark:bg-slate-900/60 text-[11px] font-black uppercase tracking-wider text-[var(--bl-muted)] border-b border-[var(--bl-border)]">
          ${sc.e} ${sc.name} (10 itens com bônus passivos)
        </div>
        ${sc.items.map((it, itemIdx) => {
          const code = `${catIdx}-${itemIdx}`;
          const ja = c.bens.includes(code);
          return itemBtn(
            it[1],
            it[0],
            it[4],
            `buyShopItem(${catIdx}, ${itemIdx})`,
            !c.vivo || ja || c.m < it[2],
            ja ? "Na estante ✔" : `R$ ${it[2]}`,
            ja ? "green" : "blue"
          );
        }).join("")}
      `;
    }
  }

  return `
    <div class="fixed inset-0 bg-black/60 z-40 flex flex-col justify-end" onclick="if(event.target===this){sheet=null;sfx('tap');render()}">
      <div class="sheet-anim w-full max-w-[480px] mx-auto bg-[var(--bl-card)] rounded-t-3xl overflow-hidden shadow-2xl border-t border-[var(--bl-border)] flex flex-col max-h-[76vh]">
        <div class="bg-[#1c2d4a] text-white px-4 py-3 flex items-center justify-between shrink-0">
          <span class="font-black text-sm">${title}</span>
          <button onclick="sheet=null;sfx('tap');render()" class="w-7 h-7 rounded-full bg-white/15 font-black text-xs flex items-center justify-center">✕</button>
        </div>
        <div class="bl-scroll overflow-y-auto flex-1">
          ${content}
        </div>
      </div>
    </div>
  `;
}

// =========================================================================
// 12. MODAIS BITLIFE (EVENTOS DE CARREIRA, RELATÓRIO DIÁRIO E FIM DE SEMESTRE)
// =========================================================================
function renderOverlay() {
  const o = S.ov;
  if (!o) return "";
  let body = "";

  if (o.t === "ev_carreira") {
    const ev = o.ev, p = P[S.at];
    body = `
      <div class="bg-[#1c2d4a] text-white px-4 py-3.5 text-center">
        <div class="text-3xl mb-1">${p.e}</div>
        <div class="font-black text-base">${ev.title}</div>
        <div class="text-[10px] font-extrabold uppercase tracking-widest text-amber-300 mt-0.5">Dilema de ${p.n}</div>
      </div>
      <div class="p-4">
        <p class="text-xs font-bold leading-relaxed mb-4 text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800/60 p-3 rounded-xl border border-[var(--bl-border)]">${ev.desc}</p>
        <div class="space-y-2.5">
          ${ev.opts.map((opt, optIdx) => `
            <button onclick="escolheCareerEvent(${optIdx})" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-slate-700 border border-[var(--bl-border)] text-left transition">
              <div class="font-black text-xs ${optIdx === 0 ? 'text-[#2eb85c]' : optIdx === 1 ? 'text-[#2b7de9]' : 'text-[#f5a623]'}">Opção ${['A','B','C'][optIdx]}</div>
              <div class="font-extrabold text-xs mt-0.5 leading-snug">${opt.label}</div>
              <div class="text-[10px] text-[var(--bl-muted)] font-bold mt-1">${fxSummary(opt.fx)}</div>
            </button>
          `).join("")}
        </div>
      </div>
    `;
  }
  else if (o.t === "rep") {
    body = `
      <div class="bg-[#1c2d4a] text-white px-4 py-3 flex items-center justify-between">
        <span class="font-black text-sm">📋 Resumo do Dia ${S.dia - 1}</span>
        <span class="text-xs font-extrabold text-amber-300">República</span>
      </div>
      <div class="p-4 space-y-2.5 max-h-[58vh] overflow-y-auto">
        ${o.rep.map(([k, txt]) => {
          const x = S.ch[k];
          return `
            <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-[var(--bl-border)] text-xs">
              <div class="flex justify-between items-center font-black mb-1">
                <span>${P[k].e} ${P[k].n}</span>
                <span class="text-[10px] text-[var(--bl-muted)]">🍔${x.f}% 💤${x.e}% 🤼${x.s}% 🎮${x.d}%</span>
              </div>
              <div class="text-slate-600 dark:text-slate-300 font-semibold">${txt}</div>
            </div>
          `;
        }).join("")}
      </div>
      <div class="p-3 bg-slate-50 dark:bg-slate-900/60 border-t border-[var(--bl-border)]">
        <button onclick="aposRel()" class="w-full py-3 rounded-xl bg-[#2eb85c] hover:bg-[#229648] text-white font-black text-sm shadow">
          Continuar ➜
        </button>
      </div>
    `;
  }
  else if (o.t === "ev") {
    const e = o.e, p = P[S.at];
    body = `
      <div class="bg-[#2b7de9] text-white px-4 py-3 text-center">
        <div class="text-3xl mb-1">${p.e}</div>
        <div class="text-[10px] font-black uppercase tracking-widest opacity-90">Situação Inesperada · ${p.n}</div>
      </div>
      <div class="p-4">
        <p class="text-sm font-extrabold leading-relaxed mb-4 text-center">${e[0]}</p>
        <div class="space-y-2.5">
          <button onclick="escolhe(0)" class="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-slate-700 border border-[var(--bl-border)] text-left transition">
            <div class="font-black text-xs text-[#2b7de9]">Opção A</div>
            <div class="font-extrabold text-sm mt-0.5">${e[1][0]}</div>
          </button>
          <button onclick="escolhe(1)" class="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-blue-50 dark:hover:bg-slate-700 border border-[var(--bl-border)] text-left transition">
            <div class="font-black text-xs text-[#f5a623]">Opção B</div>
            <div class="font-extrabold text-sm mt-0.5">${e[2][0]}</div>
          </button>
        </div>
      </div>
    `;
  }
  else if (o.t === "fim") {
    const rk = S.ch.map((x, k) => ({
      k, x,
      pt: Math.round(x.m / 50 + x.p * 2 + (x.f + x.e + x.s + x.d + x.h) / 5 + (x.inv.length + x.bens.length) * 5 + x.pets.length * 10 + (x.vivo ? 100 : 0))
    })).sort((a, b) => b.pt - a.pt);

    body = `
      <div class="bg-[#1c2d4a] text-white px-4 py-4 text-center">
        <div class="text-3xl mb-1">🪦</div>
        <div class="font-black text-lg">Cemitério & Legado da República</div>
        <div class="inline-block mt-1 px-3 py-0.5 rounded-full bg-amber-400 text-[#1c2d4a] font-black text-[11px] uppercase tracking-wider">
          ${S.dia > DIAS ? `Faixa: Sobrevivente dos ${DIAS} Dias` : "Faixa: Caos Acadêmico"}
        </div>
      </div>
      <div class="p-4 space-y-2.5 max-h-[55vh] overflow-y-auto">
        ${rk.map((r, idx) => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-[var(--bl-border)]">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="text-xl font-black">${["🥇", "🥈", "🥉"][idx] || P[r.k].e}</span>
              <div class="min-w-0">
                <div class="font-black text-sm truncate">${P[r.k].e} ${P[r.k].n}</div>
                <div class="text-[11px] font-bold text-[var(--bl-muted)] truncate">
                  ${r.x.vivo ? `${P[r.k].car[lvl(r.x)]} · R$ ${r.x.m} · 🛍️${r.x.inv.length + r.x.bens.length} 🐾${r.x.pets.length}` : r.x.causa}
                </div>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-[#2eb85c]/15 text-[#2eb85c] font-black text-xs shrink-0">
              ${r.pt} pts
            </span>
          </div>
        `).join("")}
      </div>
      <div class="p-3 bg-slate-50 dark:bg-slate-900/60 border-t border-[var(--bl-border)]">
        <button onclick="novo()" class="w-full py-3 rounded-xl bg-[#2eb85c] hover:bg-[#229648] text-white font-black text-sm shadow">
          🔄 Começar Nova Vida
        </button>
      </div>
    `;
  }

  return `
    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="modal-anim w-full max-w-sm bg-[var(--bl-card)] rounded-2xl overflow-hidden shadow-2xl border border-[var(--bl-border)]">
        ${body}
      </div>
    </div>
  `;
}

novo();
</script>
</body>
</html>
